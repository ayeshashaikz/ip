
<!DOCTYPE html>
<html>
<head>
<title>StyleHub</title>
<style>
body { font-family: Arial; margin: 25px; background: #f5f5f5; }
header { background: #222; color: white; padding: 20px; }
.products { display: flex; gap: 15px; flex-wrap: wrap; }
.card { background: white; padding: 20px; width: 180px; }
button { background: #222; color: white; padding: 8px; cursor: pointer; }
</style>
</head>
<body>
<header>
<h1>StyleHub Fashion Store</h1>
<p>Clothing | Footwear | Accessories</p>
</header>

<h2>Our Products</h2>
<input id="search" placeholder="Search products"
oninput="showProducts()">

<div class="products" id="products"></div>
<h3 id="cart">Cart: 0 items</h3>

<script>
const items = [
 {name:"T-Shirt", category:"Clothing", price:499},
 {name:"Jeans", category:"Clothing", price:999},
 {name:"Shoes", category:"Footwear", price:1499},
 {name:"Handbag", category:"Accessories", price:799}
];

let count = 0, total = 0;

function showProducts() {
 const q = document.getElementById("search").value.toLowerCase();
 document.getElementById("products").innerHTML =
 items.filter(p => p.name.toLowerCase().includes(q))
 .map(p => `<div class="card">
 <h3>${p.name}</h3>
 <p>${p.category}</p>
 <p>Price: ₹${p.price}</p>
 <button onclick="addCart(${p.price})">Add to Cart</button>
 </div>`).join("");
}

function addCart(price) {
 count++;
 total += price;
 document.getElementById("cart").textContent =
 `Cart: ${count} items | Total: ₹${total}`;
}

showProducts();
</script>
</body>
</html>
